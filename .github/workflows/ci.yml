name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Sources match their checksums
        run: pnpm ef verify
      - name: Every run, metric and gate decision reproduces with no API key
        run: pnpm ef reproduce
        env:
          OPENAI_API_KEY: ""
      - run: pnpm build
